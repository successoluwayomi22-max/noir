name: noir_app
description: "Noir & Co. — Premium Fashion Store"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  firebase_analytics: ^11.2.0
  shimmer: ^3.0.0
  video_player: ^2.14.0
  pay: ^3.3.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  webview_flutter: ^4.12.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3
  local_auth: ^3.0.2
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.8
  mobile_scanner: ^7.4.0
  google_sign_in: 6.1.5
  timeago: ^3.7.1
  share_plus: ^10.1.4
  audioplayers: ^6.8.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#687158"
  adaptive_icon_foreground: "assets/app_icon.jpg"

flutter_native_splash:
  color: "#2C2C2C" # Charcoal background
  image: "assets/app_icon.jpg"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - .env

